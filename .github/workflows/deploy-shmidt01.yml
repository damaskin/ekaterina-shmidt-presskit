name: Deploy to shmidt01.ru

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: shmidt01-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ vars.SHMIDT01_SSH_HOST }}
      SSH_USER: ${{ vars.SHMIDT01_SSH_USER }}
      REMOTE_DIR: /opt/ekaterina-shmidt
      VITE_BOOKING_API_URL: ${{ vars.VITE_BOOKING_API_URL }}
      VITE_GUIDE_BOT_USERNAME: ${{ vars.VITE_GUIDE_BOT_USERNAME }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_BOOKING_API_URL: ${{ env.VITE_BOOKING_API_URL != '' && env.VITE_BOOKING_API_URL || 'https://shmidt01.ru/api/booking' }}
          VITE_GUIDE_BOT_USERNAME: ${{ env.VITE_GUIDE_BOT_USERNAME != '' && env.VITE_GUIDE_BOT_USERNAME || 'shmidt01' }}
          VITE_SITE_URL: https://shmidt01.ru

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SHMIDT01_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          HOST="${SSH_HOST:-167.233.91.168}"
          USER="${SSH_USER:-root}"
          for attempt in 1 2 3; do
            if ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            echo "ssh-keyscan attempt $attempt failed, retrying..."
            sleep 3
          done
          test -s ~/.ssh/known_hosts || {
            echo "Could not fetch SSH host key for $HOST"
            exit 1
          }
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 \
            "${USER}@${HOST}" "echo deploy-ssh-ok"

      - name: Sync files
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          HOST="${SSH_HOST:-167.233.91.168}"
          USER="${SSH_USER:-root}"
          TARGET="${USER}@${HOST}"

          ssh $SSH_OPTS "$TARGET" "mkdir -p ${REMOTE_DIR}/web ${REMOTE_DIR}/web/assets ${REMOTE_DIR}/server ${REMOTE_DIR}/infra/shmidt01/data"

          rsync -az --delete -e "ssh $SSH_OPTS" dist/assets/ "${TARGET}:${REMOTE_DIR}/web/assets/"
          rsync -az --delete -e "ssh $SSH_OPTS" \
            --exclude 'assets/' \
            dist/ "${TARGET}:${REMOTE_DIR}/web/"
          rsync -az -e "ssh $SSH_OPTS" \
            --exclude '.env' \
            --exclude 'data/' \
            server/ "${TARGET}:${REMOTE_DIR}/server/"
          rsync -az -e "ssh $SSH_OPTS" \
            --exclude '.env' \
            --exclude 'data/' \
            infra/shmidt01/ "${TARGET}:${REMOTE_DIR}/infra/shmidt01/"
          rsync -az -e "ssh $SSH_OPTS" scripts/ "${TARGET}:${REMOTE_DIR}/scripts/"

      - name: Rebuild booking API
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          HOST="${SSH_HOST:-167.233.91.168}"
          USER="${SSH_USER:-root}"
          ssh $SSH_OPTS "${USER}@${HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/ekaterina-shmidt/infra/shmidt01
          test -f .env || { echo "Missing .env on server"; exit 1; }
          sed -i 's/\r$//' .env
          if ! grep -q '^TELEGRAM_BOT_TOKEN=.\+' .env; then
            echo "TELEGRAM_BOT_TOKEN is empty in /opt/ekaterina-shmidt/infra/shmidt01/.env"
            exit 1
          fi
          docker compose build
          docker compose up -d --force-recreate
          docker cp /opt/ekaterina-shmidt/scripts/drain-telegram.mjs shmidt-booking-api:/tmp/drain-telegram.mjs
          docker exec -e API_BASE=http://127.0.0.1:3002 shmidt-booking-api node /tmp/drain-telegram.mjs
          REMOTE

      - name: Ensure nginx serves shmidt01.ru
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          HOST="${SSH_HOST:-167.233.91.168}"
          USER="${SSH_USER:-root}"
          rsync -az -e "ssh $SSH_OPTS" scripts/fix-nginx-shmidt01.sh scripts/fix-tcp-delivery.sh "${USER}@${HOST}:/tmp/"
          ssh $SSH_OPTS "${USER}@${HOST}" "sed -i 's/\r$//' /tmp/fix-tcp-delivery.sh /tmp/fix-nginx-shmidt01.sh && bash /tmp/fix-tcp-delivery.sh && bash /tmp/fix-nginx-shmidt01.sh"

      - name: Smoke test
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          HOST="${SSH_HOST:-167.233.91.168}"
          USER="${SSH_USER:-root}"
          ssh $SSH_OPTS "${USER}@${HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          curl -sfk --resolve shmidt01.ru:443:127.0.0.1 https://shmidt01.ru/api/health >/dev/null
          test -n "$(docker exec shmidt-booking-api printenv TELEGRAM_BOT_TOKEN)"
          HTML=$(curl -sfk --resolve shmidt01.ru:443:127.0.0.1 https://shmidt01.ru/)
          echo "$HTML" | grep -q 'Ekaterina Shmidt'
          MAIN=$(echo "$HTML" | grep -o 'main-[^"]*\.js' | head -1)
          test -n "$MAIN"
          curl -sfk -o /dev/null --resolve shmidt01.ru:443:127.0.0.1 "https://shmidt01.ru/assets/$MAIN"
          curl -sfk -I --resolve shmidt01.ru:443:127.0.0.1 https://shmidt01.ru/ | grep -qi 'cache-control: no-cache, no-store, must-revalidate'
          GUIDE=$(curl -sfk --resolve shmidt01.ru:443:127.0.0.1 https://shmidt01.ru/guide/)
          echo "$GUIDE" | grep -o '/assets/[^"]*\.js' | sort -u | while read -r asset; do
            curl -sfk -o /dev/null --resolve shmidt01.ru:443:127.0.0.1 "https://shmidt01.ru${asset}"
          done
          ADMIN=$(curl -sfk --resolve shmidt01.ru:443:127.0.0.1 https://shmidt01.ru/admin/)
          echo "$ADMIN" | grep -q 'Админ-панель'
          echo "$ADMIN" | grep -o '/assets/admin-[^"]*\.js' | head -1 | while read -r asset; do
            curl -sfk -o /dev/null --resolve shmidt01.ru:443:127.0.0.1 "https://shmidt01.ru${asset}"
          done
          curl -sfk --resolve shmidt01.ru:443:127.0.0.1 https://shmidt01.ru/api/admin/session | grep -qE 'unauthorized|admin disabled'
          REMOTE
