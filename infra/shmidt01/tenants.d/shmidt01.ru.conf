# shmidt01.ru — presskit + booking API (managed from ekaterina-shmidt-presskit repo)
upstream shmidt_booking {
  server shmidt-booking-api:3002;
  keepalive 8;
}

server {
  listen 80;
  server_name shmidt01.ru www.shmidt01.ru;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://shmidt01.ru$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name shmidt01.ru;

  ssl_certificate     /etc/letsencrypt/live/shmidt01.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/shmidt01.ru/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_buffer_size 4k;

  gzip on;
  gzip_static on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types application/javascript text/css application/json image/svg+xml;

  sendfile off;
  tcp_nodelay on;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  root /var/www/shmidt-presskit;
  index index.html;

  location ~* \.html$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location ~* \.(?:css|js|mjs)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?|ttf|otf|wav|mp3|m4a|ogg|aac)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  location /guide/ {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri $uri/ /guide/index.html;
  }

  location /admin/ {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri $uri/ /admin/index.html;
  }

  location = /api {
    proxy_pass http://shmidt_booking/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location /api/ {
    proxy_pass http://shmidt_booking/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location /webhook {
    proxy_pass http://shmidt_booking/webhook;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
  }

  location / {
    try_files $uri $uri/ @spa;
  }

  location @spa {
    root /var/www/shmidt-presskit;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files /index.html =404;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.shmidt01.ru;

  ssl_certificate     /etc/letsencrypt/live/shmidt01.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/shmidt01.ru/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  return 301 https://shmidt01.ru$request_uri;
}
