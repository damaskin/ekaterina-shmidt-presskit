# Internal HTTP for edge-proxy (TLS terminates at edge).
upstream shmidt_booking_int {
  server shmidt-booking-api:3002;
  keepalive 8;
}

server {
  listen 8080;
  server_name shmidt01.ru www.shmidt01.ru;

  root /var/www/shmidt-presskit;
  index index.html;

  location ~* \.html$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location ~* \.(?:css|js|mjs|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|otf|wav|mp3|m4a|ogg|aac)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  location /guide/ {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri $uri/ /guide/index.html;
  }

  location /admin/ {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri $uri/ /admin/index.html;
  }

  location = /api {
    proxy_pass http://shmidt_booking_int/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
  }

  location /api/ {
    proxy_pass http://shmidt_booking_int/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
  }

  location /webhook {
    proxy_pass http://shmidt_booking_int/webhook;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
  }

  location / {
    try_files $uri $uri/ @spa;
  }

  location @spa {
    root /var/www/shmidt-presskit;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files /index.html =404;
  }
}
