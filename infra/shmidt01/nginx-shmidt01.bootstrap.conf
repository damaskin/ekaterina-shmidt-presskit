  upstream shmidt_booking {
    server shmidt-booking-api:3002;
    keepalive 8;
  }

  # HTTP до выпуска SSL (DNS: A @ и www → 91.201.54.196)
  server {
    listen 80;
    server_name shmidt01.ru www.shmidt01.ru;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    root /var/www/shmidt-presskit;
    index index.html;

    location = /index.html {
      add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:css|js|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|otf)$ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location /api/ {
      proxy_pass http://shmidt_booking/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
    }

    location /webhook {
      proxy_pass http://shmidt_booking/webhook;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
