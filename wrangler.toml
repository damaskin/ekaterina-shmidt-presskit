name = "ekaterina-shmidt-booking"
main = "worker/src/index.js"
compatibility_date = "2024-01-01"

# После создания БД: npx wrangler d1 create ekaterina-shmidt-booking
# Подставьте database_id ниже и выполните: npx wrangler d1 migrations apply ekaterina-shmidt-booking --remote
[[d1_databases]]
binding = "DB"
database_name = "ekaterina-shmidt-booking"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# Secrets:
# TELEGRAM_BOT_TOKEN
# TELEGRAM_OWNER_ID   — владелец (может /promote, /demote)
# TELEGRAM_CHAT_ID    — fallback, если в D1 ещё нет админов
# TELEGRAM_WEBHOOK_SECRET — опционально, для POST /webhook
